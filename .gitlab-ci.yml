stages:
  - build
  - release

variables:
  ENV_NAME: arduino_nano_esp32
  BIN_PATH: .pio/build/$ENV_NAME/firmware.bin

build-firmware:
  stage: build
  image: python:3.11
  script:
    - pip install platformio
    - pio run -e $ENV_NAME --disable-auto-clean  # bygger utan att försöka nå COM6
  artifacts:
    paths:
      - $BIN_PATH
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    
release-firmware:
  stage: release
  image: curlimages/curl:latest
  needs: [build-firmware]
  script:
    - SHA=$(sha256sum $BIN_PATH | awk '{print $1}')
    - |
      curl -X POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" \
        -H "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{
          \"name\": \"Release $CI_COMMIT_TAG\",
          \"tag_name\": \"$CI_COMMIT_TAG\",
          \"description\": \"Firmware $CI_COMMIT_TAG\"
        }"
    - |
      curl -X POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/uploads" \
        -H "PRIVATE-TOKEN: $GITLAB_RELEASE_TOKEN" \
        -F "file=@$BIN_PATH" \
        -o upload.json
    - URL=$(cat upload.json | python3 -c "import sys,json; print(json.load(sys.stdin)['full_path'])")
    - FULL_URL="https://gitlab.lnu.se$URL"
    - |
      curl -X POST "https://mellin.net/wellaware/api/v1/ota/release" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer $OTA_ADMIN_SECRET" \
        -d "{
          \"version\": \"$CI_COMMIT_TAG\",
          \"sha256\": \"$SHA\",
          \"url\": \"$FULL_URL\"
        }"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/