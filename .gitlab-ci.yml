stages:
  - tag
  - build
  - release

variables:
  ENV_NAME: arduino_nano_esp32
  BIN_PATH: .pio/build/$ENV_NAME/firmware.bin

auto-tag:
  stage: tag
  image: alpine:latest
  script:
    - apk add --no-cache git
    - git fetch --tags
    - PREFIX="v${VERSION_MAJOR}.${VERSION_MINOR}."
    - LATEST=$(git tag --sort=-v:refname | grep -E "^${PREFIX}[0-9]+$" | head -1)
    - |
      if [ -z "$LATEST" ]; then
        PATCH=0
      else
        PATCH=$(echo $LATEST | cut -d. -f3)
        PATCH=$((PATCH + 1))
      fi
    - NEW_TAG="v${VERSION_MAJOR}.${VERSION_MINOR}.${PATCH}"
    - echo "Tagging $NEW_TAG"
    - git config user.email "gitlab-ci@gitlab.com"
    - git config user.name "GitLab CI"
    - git tag $NEW_TAG
    - git push "https://oauth2:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" $NEW_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"

build-firmware:
  stage: build
  image: python:3.11
  script:
    - pip install platformio
    - ROOT_CA=$(echo "$ROOT_CA_CERT" | base64 -d)
    - |
      cat > $CI_PROJECT_DIR/config.h << EOF
      #pragma once

      #define API_BASE_URL "$API_BASE_URL"
      #define API_TIMEOUT_MS 5000

      #define SETUP_AP_SSID "WellAware-Device-Setup"
      #define SETUP_TIMEOUT_MS 30000

      #define FLASH_SAVE_INTERVAL 15 * 60 * 1000
      #define MEASUREMENTS_FILE "/measurements.bin"
      #define MAX_MEASUREMENTS 500

      #define ECHO_PIN 4
      #define TRIG_PIN 5
      #define MEDIAN_SAMPLES 12

      #define DEFAULT_CALCULATION_METHOD "validation"
      #define CALCULATION_METHOD_FILE "/calculation_method.txt"
      #define VALIDATION_MIN_INTERVAL_SEC 60

      #define TOKEN_REFRESH_INTERVAL 3600000
      #define OTA_CHECK_INTERVAL 6UL * 60UL * 60UL * 1000UL

      #define NTP_SERVER "pool.ntp.org"
      #define GMT_OFFSET_SEC 0
      #define DAYLIGHT_OFFSET_SEC 0

      static const char ROOT_CA_CERT[] = R"($ROOT_CA)";
      EOF
    - pio run -e $ENV_NAME --disable-auto-clean
  artifacts:
    paths:
      - $BIN_PATH
    expire_in: 4 hour
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/

release-firmware:
  stage: release
  image: alpine:latest
  needs: [build-firmware]
  script:
    - apk add --no-cache curl coreutils
    - SHA=$(sha256sum $BIN_PATH | awk '{print $1}')
    - base64 -w 0 $BIN_PATH > firmware.b64
    - BINARY=$(cat firmware.b64)
    - |
      printf '{"version":"%s","sha256":"%s","binary":"%s"}' \
        "$CI_COMMIT_TAG" "$SHA" "$BINARY" > payload.json
    - |
      curl -X POST "$API_BASE_URL/ota/release" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer $OTA_ADMIN_SECRET" \
        --data-binary @payload.json
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/

create-gitlab-release:
  stage: release
  image: alpine:latest
  needs: [release-firmware]
  script:
    - apk add --no-cache curl
    - |
      curl --fail-with-body -X POST \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/releases" \
        -H "Authorization: Bearer $CI_PUSH_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{
          \"name\": \"Release $CI_COMMIT_TAG\",
          \"tag_name\": \"$CI_COMMIT_TAG\",
          \"description\": \"Firmware release $CI_COMMIT_TAG\"
        }"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/