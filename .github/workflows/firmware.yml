name: WellAware Firmware

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  auto-tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create next version tag
        id: version
        env:
          VERSION_MAJOR: ${{ vars.VERSION_MAJOR }}
          VERSION_MINOR: ${{ vars.VERSION_MINOR }}
        run: |
          if [ -z "$VERSION_MAJOR" ] || [ -z "$VERSION_MINOR" ]; then
            echo "ERROR: VERSION_MAJOR and VERSION_MINOR must be set"
            exit 1
          fi

          git fetch --tags

          PREFIX="v${VERSION_MAJOR}.${VERSION_MINOR}."

          LATEST=$(git tag --sort=-v:refname \
            | grep -E "^${PREFIX}[0-9]+$" \
            | head -1 || true)

          if [ -z "$LATEST" ]; then
            PATCH=0
          else
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${VERSION_MAJOR}.${VERSION_MINOR}.${PATCH}"

          echo "Creating tag: $NEW_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$NEW_TAG" "$GITHUB_SHA"
          git push origin "$NEW_TAG"

          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"


  build-firmware:
    needs: auto-tag

    outputs:
      tag: ${{ needs.auto-tag.outputs.tag }}

    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      ENV_NAME: arduino_nano_esp32
      BIN_PATH: .pio/build/arduino_nano_esp32/firmware.bin

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.auto-tag.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Generate config.h
        shell: bash
        env:
          ROOT_CA_CERT: ${{ secrets.ROOT_CA_CERT }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          ROOT_CA=$(echo "$ROOT_CA_CERT" | base64 -d)

          cat > config.h << EOF
          #pragma once

          #define API_BASE_URL "$API_BASE_URL"
          #define API_TIMEOUT_MS 5000

          #define SETUP_AP_SSID "WellAware-Device-Setup"
          #define SETUP_TIMEOUT_MS 30000

          #define FLASH_SAVE_INTERVAL 15 * 60 * 1000
          #define MEASUREMENTS_FILE "/measurements.bin"
          #define MAX_MEASUREMENTS 500

          #define ECHO_PIN 4
          #define TRIG_PIN 5
          #define MEDIAN_SAMPLES 12

          #define DEFAULT_CALCULATION_METHOD "validation"
          #define CALCULATION_METHOD_FILE "/calculation_method.txt"
          #define VALIDATION_MIN_INTERVAL_SEC 60

          #define TOKEN_REFRESH_INTERVAL 3600000
          #define OTA_CHECK_INTERVAL 6UL * 60UL * 60UL * 1000UL

          #define NTP_SERVER "pool.ntp.org"
          #define GMT_OFFSET_SEC 0
          #define DAYLIGHT_OFFSET_SEC 0

          static const char ROOT_CA_CERT[] = R"($ROOT_CA)";
          EOF

      - name: Build firmware
        run: pio run -e $ENV_NAME --disable-auto-clean

      - name: Calculate SHA256
        id: hash
        run: |
          SHA=$(sha256sum "$BIN_PATH" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ${{ env.BIN_PATH }}
          retention-days: 1


  release-firmware:
    needs: build-firmware
    runs-on: ubuntu-latest

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v5
        with:
          name: firmware
          path: firmware

      - name: Create OTA release payload
        env:
          OTA_VERSION: ${{ needs.build-firmware.outputs.tag }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          OTA_ADMIN_SECRET: ${{ secrets.OTA_ADMIN_SECRET }}
        run: |
          BIN_PATH="firmware/firmware.bin"

          SHA=$(sha256sum "$BIN_PATH" | awk '{print $1}')

          base64 -w 0 "$BIN_PATH" > firmware.b64

          BINARY=$(cat firmware.b64)

          printf '{"version":"%s","sha256":"%s","binary":"%s"}' \
            "$OTA_VERSION" \
            "$SHA" \
            "$BINARY" > payload.json

          echo "OTA version: $OTA_VERSION"
          echo "SHA256: $SHA"

      - name: Upload firmware to WellAware
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          OTA_ADMIN_SECRET: ${{ secrets.OTA_ADMIN_SECRET }}
        run: |
          curl --fail-with-body \
            -X POST \
            "$API_BASE_URL/ota/release" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OTA_ADMIN_SECRET" \
            --data-binary @payload.json